# Free tiers sleep when idle: Supabase pauses after ~7 days without traffic, Render after 15 min.
# This pings both so the pilot keeps working. Reuses the app build settings (EXPO_PUBLIC_* secrets/variables).
name: Keep alive
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS "${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}/rest/v1/settings?select=key&limit=1" -H "apikey: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}" -o /dev/null || echo "supabase ping failed"
      - name: Ping API
        run: |
          curl -fsS "${{ vars.EXPO_PUBLIC_API_URL }}/health" || echo "api ping failed"
