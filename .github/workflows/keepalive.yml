# Free tiers sleep when idle: Supabase pauses after ~7 days without traffic, Render after 15 min.
# This pings both so the pilot keeps working. Set repository secrets SUPABASE_URL, SUPABASE_ANON_KEY, API_URL.
name: Keep alive
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/settings?select=key&limit=1" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" -o /dev/null || echo "supabase ping failed"
      - name: Ping API
        run: curl -fsS "${{ secrets.API_URL }}/health" || echo "api ping failed"
