; Bin fill sensor: ESP32 DevKit (38-pin) + AJ-SR04M / JSN-SR04T
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Real program: measure → send over WiFi → deep sleep.
[env:esp32dev]
build_src_filter = +<main.cpp>

; Live distance/battery print-out for wiring checks. Upload with: pio run -e sensor-test -t upload
[env:sensor-test]
build_src_filter = +<sensor_test.cpp>
